services:
  frontend:
    build: ./frontend/jwtpsql
    container_name: nextjs-app
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_JWT_AUTH_API_DOMAIN: "localhost:8080"   # localhost because the fetches are in a client-side context file
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: springboot-api
    ports:
      - "8080:8080"
    environment:
      # For NEON Postgres:
      # SPRING_DATASOURCE_URL: jdbc:postgresql://ep-purple-sky-aex6jkne-pooler.c-2.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      # SPRING_DATASOURCE_USERNAME: <username>
      # SPRING_DATASOURCE_PASSWORD: <password>
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      # If using MongoDB instead:
      # SPRING_DATA_MONGODB_URI: mongodb+srv://<user>:<password>@cluster.mongodb.net/<db>
